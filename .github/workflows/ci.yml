name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pin the runner's clock zone. vitest.setup.ts also sets process.env.TZ,
      # but that only covers the Vitest workers — this covers tsc, eslint, the
      # Vite build and anything else that formats a date. Until 2026-09 nothing
      # set TZ anywhere and the suite's determinism was accidental
      # (audit 2026-09, 12-qa-review.md F-12).
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test

      - name: Production build
        # Dummy Supabase env vars so Vite's import.meta.env reads don't fail
        # the build. The build does not contact Supabase at compile time.
        env:
          VITE_SUPABASE_URL: 'https://example.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'ci-dummy-anon-key'
          VITE_PUBLIC_APP_URL: 'https://example.com'
        run: npm run build
